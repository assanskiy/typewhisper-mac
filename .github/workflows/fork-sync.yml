# Fork-only: daily mirror of upstream main into `main` and rebase of the fork tooling (`tooling`), promoted only after fork-check passes.
# FORK_SYNC_TOKEN: fine-grained PAT for this repository only (Contents, Workflows, Actions, Issues: read and write);
# the built-in token cannot push commits that touch .github/workflows, and upstream edits them often.
name: fork-sync

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      status: ${{ steps.sync.outputs.status }}
      old: ${{ steps.sync.outputs.old }}
    env:
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
    steps:
      - name: Token present
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::secret FORK_SYNC_TOKEN is not set, see the header of this file"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: tooling
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN }}
      - name: Keep upstream workflows off in the fork
        run: |
          gh workflow list --all --json name,path,state --jq '.[] | select((.path | test("/fork-[^/]*$") | not) and .state == "active") | .path' \
            | while read -r wf; do gh workflow disable "$(basename "$wf")" && echo "disabled $wf"; done
      - name: Rebase
        id: sync
        run: |
          git config user.name "fork-sync"
          git config user.email "fork-sync@users.noreply.github.com"
          echo "old=$(git rev-parse origin/tooling)" >> "$GITHUB_OUTPUT"
          rc=0; bash fork/sync.sh > sync.log 2>&1 || rc=$?
          cat sync.log
          if [ "$rc" = 2 ]; then echo "status=conflict" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "$rc" = 0 ] || exit "$rc"
          git push --force origin upstream/main:refs/heads/main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/tooling)" ]; then echo "status=same" >> "$GITHUB_OUTPUT"; exit 0; fi
          git push --force origin HEAD:refs/heads/sync/candidate
          echo "status=candidate" >> "$GITHUB_OUTPUT"
      - name: Conflict issue
        if: steps.sync.outputs.status == 'conflict'
        run: |
          body="$(printf 'Rebasing `tooling` onto upstream main stopped; `tooling` is unchanged.\n\n```\n%s\n```\nResolve per fork/README.md § Sync.' "$(tail -n 40 sync.log)")"
          open="$(gh issue list --state open --search 'sync conflict in:title' --json number --jq '.[0].number')"
          if [ -n "$open" ]; then gh issue comment "$open" --body "$body"; else gh issue create --title "sync conflict" --body "$body"; fi
          exit 1

  check:
    needs: rebase
    if: needs.rebase.outputs.status == 'candidate'
    uses: ./.github/workflows/fork-check.yml
    with:
      ref: sync/candidate

  promote:
    needs: [rebase, check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN }}
      - name: Move tooling to the checked candidate
        run: git push --force-with-lease=tooling:${{ needs.rebase.outputs.old }} origin origin/sync/candidate:refs/heads/tooling
